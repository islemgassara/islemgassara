apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-hub
  namespace: integration-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-hub
  template:
    metadata:
      labels:
        app: integration-hub
    spec:
      containers:
        - name: integration-hub
          image: integration-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/hub_db
            - name: DB_USERNAME
              value: hub_admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: DB_PASSWORD
            - name: HUB_CRYPTO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: HUB_CRYPTO_SECRET_KEY
            - name: N8N_BASE_URL
              value: http://n8n:5678
            - name: N8N_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: N8N_WEBHOOK_SECRET
            - name: HUB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: HUB_JWT_SECRET
            - name: HUB_AUTH_MODE
              value: shared-jwt
          readinessProbe:
            httpGet:
              path: /router-api/2/ping
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /router-api/2/ping
              port: 8085
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: integration-hub
  namespace: integration-hub
spec:
  selector:
    app: integration-hub
  ports:
    - port: 8085
      targetPort: 8085

