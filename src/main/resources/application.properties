spring.application.name=integration-hub
server.port=${SERVER_PORT:8085}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hub_db}
spring.datasource.username=${DB_USERNAME:hub_admin}
spring.datasource.password=${DB_PASSWORD:hub_password}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

hub.crypto.secret-key=${HUB_CRYPTO_SECRET_KEY}

n8n.base-url=${N8N_BASE_URL:http://localhost:5678}
n8n.webhook-secret=${N8N_WEBHOOK_SECRET}

hub.auth.mode=${HUB_AUTH_MODE:shared-jwt}
hub.jwt.secret=${HUB_JWT_SECRET}
