name: CI/CD - Integration Hub

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "hub-chart/.argocd-source-integration-hub.yaml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "hub-chart/.argocd-source-integration-hub.yaml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hub_db
          POSTGRES_USER: hub_admin
          POSTGRES_PASSWORD: hub_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5433/hub_db
      DB_USERNAME: hub_admin
      DB_PASSWORD: hub_password
      HUB_CRYPTO_SECRET_KEY: cxkoEGNRRaAAX5OnzEZs4bBdXl+9ex+YqiyaVcxN0DQ=
      N8N_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_SECRET: L3Gc0CIdI4pGKPSYNyon19Jlj7Q6b6cm
      HUB_JWT_SECRET: AEtF73KtjsYBuCIGKa+9Vuib8qWUBKC2uQtqY/FmrcB+Iv2xDiEZfGv4dSyGDi+upptBEKC/NRKQyMbo5eO4wg==
      HUB_AUTH_MODE: shared-jwt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean package -DskipTests -B
      - name: Run tests
        run: mvn test -B

  docker-build-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t integration-hub:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'integration-hub:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (SHA + latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag integration-hub:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/integration-hub:${{ steps.vars.outputs.sha_short }}
          docker tag integration-hub:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/integration-hub:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/integration-hub:${{ steps.vars.outputs.sha_short }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/integration-hub:latest
  odm-docker-build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        run: docker build -t odm-authentication:${{ github.sha }} ./odm-authentication
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'odm-authentication:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image (SHA + latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag odm-authentication:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/odm-authentication:${{ steps.vars.outputs.sha_short }}
          docker tag odm-authentication:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/odm-authentication:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/odm-authentication:${{ steps.vars.outputs.sha_short }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/odm-authentication:latest
