services:
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_DB: hub_db
      POSTGRES_USER: hub_admin
      POSTGRES_PASSWORD: hub_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_admin -d hub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:1.60.1
    container_name: hub-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hub-network

  integration-hub:
    build: .
    container_name: integration-hub
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hub_db
      DB_USERNAME: hub_admin
      DB_PASSWORD: hub_password
      HUB_CRYPTO_SECRET_KEY: cxkoEGNRRaAAX5OnzEZs4bBdXl+9ex+YqiyaVcxN0DQ=
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: L3Gc0CIdI4pGKPSYNyon19Jlj7Q6b6cm
      HUB_JWT_SECRET: AEtF73KtjsYBuCIGKa+9Vuib8qWUBKC2uQtqY/FmrcB+Iv2xDiEZfGv4dSyGDi+upptBEKC/NRKQyMbo5eO4wg==
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hub-network

networks:
  hub-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
