apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-workflow-import
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: integration-hub
    spec:
      restartPolicy: Never
      containers:
        - name: import-workflow
          image: python:3.11-alpine
          env:
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: N8N_API_KEY
          volumeMounts:
            - name: workflow-file
              mountPath: /workflow
          command:
            - sh
            - -c
            - |
              set -e
              pip install requests --quiet --break-system-packages 2>/dev/null || pip install requests --quiet
              python3 << 'PYSCRIPT'
              import json, time, os, requests

              N8N_URL = "http://n8n:5678"
              API_KEY = os.environ["N8N_API_KEY"]
              HEADERS = {"X-N8N-API-KEY": API_KEY, "Content-Type": "application/json"}

              print("Attente de n8n...")
              for _ in range(60):
                  try:
                      r = requests.get(f"{N8N_URL}/healthz", timeout=3)
                      if r.status_code == 200:
                          break
                  except Exception:
                      pass
                  time.sleep(3)
              print("n8n est prêt.")

              existing = requests.get(f"{N8N_URL}/api/v1/workflows", headers=HEADERS).json()
              names = [w["name"] for w in existing.get("data", [])]

              if "cfec" not in names:
                  print("Import du workflow cfec...")
                  with open("/workflow/workflow.json") as f:
                      workflow = json.load(f)
                  resp = requests.post(f"{N8N_URL}/api/v1/workflows", headers=HEADERS, json=workflow)
                  resp.raise_for_status()
                  wf_id = resp.json()["id"]
                  print(f"Workflow créé avec ID: {wf_id}")
                  act = requests.post(f"{N8N_URL}/api/v1/workflows/{wf_id}/activate", headers=HEADERS)
                  act.raise_for_status()
                  print("Workflow activé avec succès.")
              else:
                  print("Le workflow existe déjà, import ignoré.")
              PYSCRIPT
      volumes:
        - name: workflow-file
          configMap:
            name: n8n-workflow-cfn
