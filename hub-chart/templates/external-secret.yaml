apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-secrets-external
  namespace: integration-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: hub-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: integration-hub
        property: dbPassword
    - secretKey: HUB_CRYPTO_SECRET_KEY
      remoteRef:
        key: integration-hub
        property: cryptoSecretKey
    - secretKey: N8N_WEBHOOK_SECRET
      remoteRef:
        key: integration-hub
        property: webhookSecret
    - secretKey: HUB_JWT_SECRET
      remoteRef:
        key: integration-hub
        property: jwtSecret
    - secretKey: N8N_API_KEY
      remoteRef:
        key: integration-hub
        property: n8nApiKey
