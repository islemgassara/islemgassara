apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.n8n.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      initContainers:
        - name: import-workflow
          image: {{ .Values.n8n.image }}
          env:
            - name: N8N_PORT
              value: "5678"
          command:
            - sh
            - -c
            - |
              set -e
              echo "Import du workflow cfec via CLI (idempotent, pas d'API key)..."
              n8n import:workflow --separate --input=/workflow
              echo "Import termine."
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
            - name: workflow-file
              mountPath: /workflow
      containers:
        - name: n8n
          image: {{ .Values.n8n.image }}
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hub-secrets
                  key: N8N_WEBHOOK_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
          readinessProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-pvc
        - name: workflow-file
          configMap:
            name: n8n-workflow-cfn
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
